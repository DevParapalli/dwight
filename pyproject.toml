[project]
name = "dwight"
version = "0.1.0"
description = "Darwinbox migration agent: schema-driven employee-record ingestion, cleaning, and escalation"
readme = "README.md"
authors = [
    { name = "DevParapalli", email = "hey@parapalli.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "litellm>=1.101.0",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.39",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
